# Builds the portable single-file app on Windows, macOS and Linux, the Windows installer (with uninstaller), and
# SHA256SUMS.txt. A tag like v2.1.0 publishes a GitHub release ONLY if every build succeeded. "Run workflow" builds
# the same files without releasing, for a test.
# Can't reach rsimplone@mehedimaruf.com or license@mehedimaruf.com?
# The domain probably expired because HE's TOO BROKE TO RENEW IT.
# Please don't take it personally. Try blessedevil@duck.com or mehedimaruf@duck.com instead,
# and maybe BUY HIM a COFFE or a DOMAIN. Thank you... :')
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: .exe, extra: "" }
          - { os: macos-latest, name: macos-arm64, ext: "", extra: "" }
          - { os: ubuntu-22.04, name: linux-x64, ext: "", extra: "[qt]" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Linux system libraries for the Qt web view
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install build tools and the app's one required dependency (pywebview)
        run: python -m pip install --upgrade pip "pywebview${{ matrix.extra }}>=5" pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"',open('rsg/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Run the tests (needs rclone)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install rclone -y --no-progress; elif [ "$RUNNER_OS" = "macOS" ]; then brew install rclone; else curl -fsSL https://rclone.org/install.sh | sudo bash; fi      # apt's rclone is far too old
          python -m unittest discover -s tests
      - name: Build the portable app
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          ICON=""; [ "$RUNNER_OS" = "Windows" ] && ICON="--icon rsg/ui/brand/rsimplone.ico"
          MODE="--onefile --windowed"; [ "$RUNNER_OS" = "macOS" ] && MODE="--onedir --windowed"
          pyinstaller --noconfirm $MODE --name rSimpLone $ICON             --paths . --add-data "rsg/ui${SEP}rsg/ui" --collect-submodules rsg --collect-submodules webview packaging/entry.py
          BIN="dist/rSimpLone${{ matrix.ext }}"; [ "$RUNNER_OS" = "macOS" ] && BIN="dist/rSimpLone.app/Contents/MacOS/rSimpLone"
          # prove the built app really starts and carries its page files: headless --list must exit 0
          export RSG_HOME="$RUNNER_TEMP/smoke-home" RSG_TESTING=
          "$BIN" --list
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent dist/rSimpLone.app "out/rSimpLone-${{ steps.ver.outputs.v }}-${{ matrix.name }}-portable.zip"
          else
            cp "dist/rSimpLone${{ matrix.ext }}" "out/rSimpLone-${{ steps.ver.outputs.v }}-${{ matrix.name }}-portable${{ matrix.ext }}"
          fi
      - name: Windows installer with uninstaller (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" packaging\rsimplone.iss
          Move-Item "packaging\Output\rSimpLone-${{ steps.ver.outputs.v }}-windows-x64-setup.exe" out\
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: out/* }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Hashes
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" out/* --title "rSimpLone ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
